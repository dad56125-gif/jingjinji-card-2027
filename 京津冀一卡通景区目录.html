<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f6">
<title>景区地图</title>
<link rel="stylesheet" href="styles.css">
<script>
  window._TMapSecurityConfig = {
    serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__',
  };
</script>
<script src="https://map.qq.com/api/gljs?v=1.exp"></script>
</head>
<body>

<!-- ================= 第 1 层：地图（最底层，铺满可视区） ================= -->
<div id="map"></div>
<div class="map-fallback" id="mapFallback" hidden></div>

<!-- ================= 第 3 层：顶部悬浮区 ================= -->
<header class="hud-top" id="hudTop">
  <div class="glass search" id="searchBox">
    <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
    <input id="q" type="text" autocomplete="off" placeholder="搜索景区名称 / 接待说明…">
    <button class="qclear" id="qClear" type="button" hidden aria-label="清空">✕</button>
  </div>

  <div class="pills" id="pills"></div>

  <button class="glass entry" id="cardEntry" type="button" aria-label="我的年卡"></button>
  <button class="glass entry mob" id="filterBtn" type="button" aria-label="筛选">
    <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
    <i class="dot" id="filterDot" hidden></i>
  </button>
</header>

<!-- 悬浮浮层容器：筛选胶囊 / 年卡入口的轻量面板 -->
<div class="glass pop" id="pop" hidden></div>

<!-- ================= 第 3 层：底部中央悬浮导航条 ================= -->
<nav class="glass nav" id="nav"></nav>

<!-- ================= 第 3/4 层：内容面板（景区列表 / 一日联玩 / 我的年卡） ================= -->
<section class="glass panel" id="panel" hidden></section>

<!-- ================= 第 4 层：地图右下角景区浮卡 ================= -->
<aside class="glass spotcard" id="spotCard" hidden></aside>

<!-- ================= 移动端 Bottom Sheet（收起 / 半展开 / 接近全屏） ================= -->
<section class="glass sheet" id="sheet" hidden>
  <div class="handle" id="sheetHandle"><span></span></div>
  <div class="sheet-scroll" id="sheetBody"></div>
</section>

<!-- ================= 第 5 层：完整详情（更高不透明度，保证阅读） ================= -->
<section class="glass detail" id="detail" hidden></section>

<div class="toast" id="toast" hidden></div>

<!-- ================= 页面说明（结构变化时保持内容不丢，放在模板里按需注入） ================= -->
<template id="notesTpl">
  <div class="notes">
    <h3>卡种标记</h3>
    <div class="legend">
      <i><i class="ct ct-jp">精品版</i>2027年京津冀旅游一卡通·精品版</i>
      <i><i class="ct ct-zx">臻选版</i>2027年京津冀名胜文化休闲旅游年卡·臻选版</i>
      <i>两枚标记同时出现 = 两张卡都收录了该景区（接待时间与权益分卡列出）</i>
      <i>合并口径：同名景区自动归并为一条；两张卡写法不同的同一景区已在 <code>data.js</code> 的 <code>merge.alias</code> 里逐条校正</i>
    </div>

    <h3>可用性标记说明</h3>
    <div class="legend">
      <i><span class="tag t-a">9.24–10.7 可用</span>该期间全时段可持卡使用（至少一张卡满足）</i>
      <i><span class="tag t-b">仅 9.24–9.30 可用</span>国庆 7 天法定假期持卡无效</i>
      <i><span class="tag t-c">仅 10.1–10.7 可用</span>接待期自 10 月 1 日起</i>
      <i><span class="tag t-d">部分日期可用</span>仅窗口内部分日期在接待期内</i>
      <i><span class="tag t-n">该时段不可用</span>两张卡的接待期都不覆盖该窗口</i>
      <i><span class="tag t-u">时间未提及</span>原文未明确接待时间</i>
    </div>

    <h3>亲子属性说明（本页补充标注，非原文内容）</h3>
    <div class="legend">
      <i><span class="badge b-kid">🧒 亲子</span>儿童 / 亲子专属（<b id="nt-kid2">–</b> 个）：主要客群就是 3–12 岁儿童及其家长，已逐项核实</i>
      <i><span class="badge b-fam">👨‍👩‍👧 家庭</span>家庭友好但非儿童专属（<b id="nt-kid1">–</b> 个）：大人小孩都能玩、成人也是主力客群的大众景点</i>
      <i>无徽标 = 非亲子 / 成人向（<b id="nt-kid0">–</b> 个）：博物馆纪念馆故居、寺庙、遗址、酒庄、温泉、相声茶馆、古镇、长城攀爬、漂流等</i>
      <i>筛选里的 <b>非亲子专属</b> = 排除亲子专属之后的全部景区（kid ≠ 2）；<b>仅非亲子 / 成人向</b> 才只保留第三档</i>
    </div>

    <h3>2026 年法定节假日（摘自年卡页面）</h3>
    <div class="legend">
      <i>中秋节：9 月 25 日–9 月 27 日（3 天）</i>
      <i>国庆节：10 月 01 日–10 月 07 日（7 天）</i>
      <i>法定假期及连休期间包含放假当天及与周末连休；标注"法定假期无效"的景区在这些日期不可用</i>
    </div>

    <h3>出游须知（摘自原文）</h3>
    <ol>
      <li>一卡通仅限本人使用，实体卡用户出行请携带实体卡、有效身份证，按景区要求顺序入园。</li>
      <li>实体卡绑定仅为预约景区使用；前往景区时必须携带实体卡（已粘贴照片）验票方可入园。</li>
      <li>目录内"标明需预约的景区"需正确预约成功后前往景区刷卡入园；未注明须预约的景区，持卡可直接前往。</li>
      <li>法定假期及调休期间无效是指国务院公布假期：元旦 3 天、春节 9 天、清明 3 天、劳动节 5 天、端午 3 天、中秋 3 天、国庆 7 天。正常周六日不算节假日。</li>
      <li>标注"优惠 1 次"的景区持卡用户需补缴费用（优惠购票）；部分景区需付费预约，成功核验入园后预约费用不退。</li>
      <li>出游当天可与景区联系是否正常接待，因景区政策或活动等原因临时闭园或无法接待的，年卡和景区方免责。</li>
    </ol>

    <h3>数据说明</h3>
    <div class="legend">
      <i>地图坐标为按所属区县近似定位（示意），非精确门址经纬度；跨区/多城市分组单独定点。</i>
      <i>距离为直线估算，仅供参考；出发前请与景区电话确认。</i>
      <i>"我的年卡 / 计划去 / 已使用记录"只存在你本机浏览器（localStorage），不上传。</i>
    </div>
  </div>
</template>

<script src="data.js"></script>
<script src="data-jp.js"></script>
<script src="data-zx.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
